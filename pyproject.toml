[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "himalaya-g1-balance"
version = "0.1.0"
description = "HumoSlope-inspired stationary four-contact balance for the Unitree G1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # Brax 0.14.2 still uses device_put_replicated, removed in JAX 0.10.
  "jax>=0.7,<0.10",
  "imageio-ffmpeg>=0.6,<0.7",
  "playground @ git+https://github.com/google-deepmind/mujoco_playground.git@8a4b4642d8eba8a80ac99ed125cb62c16e1457ad",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
test = ["pytest>=8"]

[project.scripts]
himalaya = "himalaya.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["himalaya"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
